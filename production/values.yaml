# Production environment overlay.
# image.tag is managed by CI (.github/workflows/release.yml `deploy-prod`
# job) — updated only after the `production` GitHub Environment's manual
# approval gate is passed, following a successful staging deploy.
#
# Everything else (replicaCount, autoscaling, podDisruptionBudget,
# topologySpreadConstraints, resources, security context) inherits
# values.yaml's HA-on defaults as-is — production is the environment those
# defaults were written for.

# ghcr-pull-secret is a real, cluster-only credential (not git-tracked) -
# created once via `kubectl create secret docker-registry`, same reasoning
# as GITOPS_REPO_TOKEN was: genuinely permanent, just not declared here.
imagePullSecrets:
  - name: ghcr-pull-secret

image:
  tag: "v0.0.16"

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: sample-nodejs.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sample-nodejs-tls
      hosts:
        - sample-nodejs.example.com

# Requires kube-prometheus-stack (sample-nodejs-gitops/argocd/
# application-monitoring.yaml) already installed and configured to
# discover ServiceMonitors cluster-wide - see that Application's
# serviceMonitorSelectorNilUsesHelmValues=false parameter.
serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true
