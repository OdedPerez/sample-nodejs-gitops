# Generates one Application per open PR against sample-nodejs, tracking
# that PR's own branch (chart + values-dev.yaml both already live there).
# No GitOps-repo involvement needed for dev: unlike staging/prod, this is
# single-source. Application + namespace are created when the PR opens and
# torn down automatically when it closes.
#
# image.tag is NOT read from values-dev.yaml - it's derived directly from
# the PR's own number + short SHA (both already tracked by the pullRequest
# generator) via a Helm parameter override below. This deliberately avoids
# having CI commit a tag bump onto the PR branch on every push (the
# earlier design did this and produced a growing pile of bot commits plus
# push-conflict friction - the tag is fully derivable from state ArgoCD
# already polls every 60s, so persisting it into a git commit was
# unnecessary). pr-checks.yml's build-scan-push job must compute the same
# tag format (pr-<number>-<7-char-short-sha>) for these to match.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-nodejs-dev
  namespace: argocd
spec:
  # Opts into Go-template rendering ({{.field}}) - without this, ArgoCD
  # uses the older fasttemplate engine ({{field}}, no dot) and silently
  # passes dotted placeholders through unsubstituted instead of erroring,
  # which is exactly what happened before this was added.
  goTemplate: true
  generators:
    - pullRequest:
        github:
          owner: OdedPerez
          repo: sample-nodejs
          tokenRef:
            secretName: github-pr-token
            key: token
        requeueAfterSeconds: 60
  template:
    metadata:
      name: "sample-nodejs-dev-pr-{{.number}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/OdedPerez/sample-nodejs.git
        targetRevision: "{{.head_sha}}"
        path: helm/sample-nodejs
        helm:
          valueFiles:
            - values-dev.yaml
          parameters:
            - name: image.tag
              value: "pr-{{.number}}-{{.head_short_sha_7}}"
            # values-dev.yaml's static ingress host would otherwise collide
            # across concurrently open PRs (same hostname, different
            # namespaces - the ingress controller can only route to one).
            # Templated per-PR here for the same reason image.tag is.
            - name: ingress.hosts[0].host
              value: "pr-{{.number}}.dev.sample-nodejs.example.com"
      destination:
        server: https://kubernetes.default.svc
        namespace: "sample-nodejs-dev-pr-{{.number}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
