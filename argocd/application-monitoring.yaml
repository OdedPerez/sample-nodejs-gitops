# Installs kube-prometheus-stack (Prometheus Operator, Prometheus,
# Alertmanager, Grafana, and the CRDs sample-nodejs's opt-in
# servicemonitor.yaml template targets) declaratively via ArgoCD, rather
# than a one-off `helm install`. Same bootstrap pattern as ArgoCD itself:
# platform tooling, applied once with kubectl to register, then ArgoCD
# owns reconciling it from here on - nothing further to run by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.6.2
    helm:
      parameters:
        # Default Prometheus config only discovers ServiceMonitors carrying
        # the label release=kube-prometheus-stack (a safety default so it
        # doesn't blindly scrape everything cluster-wide). We want the
        # opposite here: any app's chart (like sample-nodejs's opt-in
        # servicemonitor.yaml) should be discoverable without needing to
        # know this stack's specific release name. This makes Prometheus
        # watch ServiceMonitors cluster-wide regardless of labels.
        - name: prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Prometheus/Alertmanager CRDs are large enough to exceed the 256KB
      # last-applied-configuration annotation limit under client-side
      # apply (same root cause as the ArgoCD install itself needing
      # --server-side) - without this, those specific CRDs silently fail
      # to apply while the rest of the chart succeeds.
      - ServerSideApply=true
