apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nodejs-prod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/OdedPerez/sample-nodejs.git
      targetRevision: main
      path: helm/sample-nodejs
      helm:
        valueFiles:
          - $values/production/values.yaml
    - repoURL: https://github.com/OdedPerez/sample-nodejs-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-nodejs-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
