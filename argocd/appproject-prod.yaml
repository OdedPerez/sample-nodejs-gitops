# Restricts the sample-nodejs-prod Application to only ever target the
# sample-nodejs-prod namespace, from only this known repo. Same
# reasoning as appproject-staging.yaml, mirrored for production.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sample-nodejs-prod
  namespace: argocd
spec:
  description: Production environment for sample-nodejs - isolated from staging
  sourceRepos:
    - https://github.com/OdedPerez/sample-nodejs-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: sample-nodejs-prod
