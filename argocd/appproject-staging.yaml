# Restricts the sample-nodejs-staging Application to only ever target the
# sample-nodejs-staging namespace, from only this known repo. If
# someone with edit access to that Application repointed its destination
# at sample-nodejs-prod (mistake or compromised credential), ArgoCD would
# reject the sync - that destination isn't whitelisted here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sample-nodejs-staging
  namespace: argocd
spec:
  description: Staging environment for sample-nodejs - isolated from production
  sourceRepos:
    - https://github.com/OdedPerez/sample-nodejs-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: sample-nodejs-staging
