# Staging environment overlay.
# image.tag is managed by CI (.github/workflows/release.yml `deploy-staging`
# job) — updated automatically on every merge to main, right after the image
# is built, Trivy-scanned, versioned, and pushed to GHCR.

replicaCount: 2

# ghcr-pull-secret is a real, cluster-only credential (not git-tracked) -
# created once via `kubectl create secret docker-registry`, same reasoning
# as GITOPS_REPO_TOKEN was: genuinely permanent, just not declared here.
imagePullSecrets:
  - name: ghcr-pull-secret

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

image:
  tag: "v0.0.13"

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: staging.sample-nodejs.example.com
      paths:
        - path: /
          pathType: Prefix
